<title>Zubabot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Phone app, one look by choice: warm white ground, Zuma yellow for actions, night navy for "power" cards, green = money, red = loss. */
:root{
  --bg:#F6F6F2; --card:#FFFFFF; --soft:#F1F1EB; --line:#ECECE5; --line2:#DEDED6;
  --ink:#0F1222; --ink2:#454A5E; --dim:#7E8397; --mute:#A9ADBC;
  --sun:#FFD21F; --sun2:#FFC300; --sun-t:#FFF6CC; --sun-ink:#5A4400;
  --night:#0F1424; --night2:#1C2338; --night-line:rgba(255,255,255,.1);
  --money:#0FB37A; --money-d:#0A8F61; --money-t:#E4F7EF;
  --loss:#EF4D57; --loss-t:#FDECEE; --amber:#F59E0B;
  --sh:0 1px 2px rgba(15,18,34,.04),0 10px 28px -14px rgba(15,18,34,.16);
  --sh2:0 18px 44px -18px rgba(15,18,34,.35);
  --f:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.03em}
button{font-family:var(--f);cursor:pointer;color:inherit;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.dim{color:var(--dim)} .ink2{color:var(--ink2)}

.app{position:relative;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 120px}
.scr.full{padding-bottom:24px}
.scr.enter>*{animation:glide .45s cubic-bezier(.2,.8,.2,1) both}
.scr.enter>*:nth-child(2){animation-delay:.05s}.scr.enter>*:nth-child(3){animation-delay:.1s}.scr.enter>*:nth-child(4){animation-delay:.15s}.scr.enter>*:nth-child(5){animation-delay:.2s}.scr.enter>*:nth-child(6){animation-delay:.25s}.scr.enter>*:nth-child(7){animation-delay:.3s}
@keyframes glide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh)}
.night{background:linear-gradient(160deg,var(--night),var(--night2));color:#FFF;border-radius:26px;box-shadow:var(--sh2);position:relative;overflow:hidden}
.night::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 85% -10%,rgba(255,210,31,.22),transparent 60%),radial-gradient(80% 60% at 0% 110%,rgba(15,179,122,.14),transparent 60%);pointer-events:none}
.night>*{position:relative}

/* buttons */
.btn{width:100%;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:16px;transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.sun{background:linear-gradient(180deg,#FFDB3D,var(--sun2));color:var(--ink);box-shadow:0 12px 28px -8px rgba(255,195,0,.7),inset 0 1px 0 rgba(255,255,255,.6);position:relative;overflow:hidden}
.btn.sun .sw{position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:sw 2.6s ease-in-out infinite;pointer-events:none}
@keyframes sw{0%{left:-60%}55%,100%{left:130%}}
.btn.ink{background:var(--ink);color:#FFF;box-shadow:0 12px 26px -12px rgba(15,18,34,.6)}
.btn.ghost{background:var(--card);border:1.5px solid var(--line2);color:var(--ink)}
.btn.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#FFF;height:46px;font-size:14px;font-weight:700;border-radius:15px}
.btn.sm{height:44px;font-size:14px;border-radius:14px;width:auto;padding:0 16px}
.btn[disabled]{opacity:.45;pointer-events:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 0}
.icb{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;box-shadow:var(--sh)}
.icb .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--loss);border:2px solid #FFF;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.pill{height:44px;padding:0 14px 0 8px;border-radius:15px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;box-shadow:var(--sh)}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1A1,var(--sun) 45%,#E8A900);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
.coin i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(90,68,0,.55)}
.pop{animation:popk .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes popk{0%{transform:scale(.6)}100%{transform:none}}

.label{font-size:13px;font-weight:700;color:var(--dim)}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px}
.sech h2{font-size:18px;font-weight:800}
.sech a,.sech button{font-size:14px;font-weight:700}

/* faces */
.face{display:block;border-radius:50%;overflow:hidden;flex-shrink:0;position:relative}
.face svg{display:block;width:100%;height:100%}
.face .eyes{animation:eyes 4.6s infinite;transform-origin:50% 48%;transform-box:view-box}
@keyframes eyes{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.face.talk .mouthT{animation:talkm .32s ease-in-out infinite;transform-origin:50% 58%;transform-box:view-box}
@keyframes talkm{50%{transform:scaleY(.35)}}
.float{animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}
.f2{animation-delay:-1.1s}.f3{animation-delay:-2.2s}

/* home hero */
.live{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#D9DCE6}
.ping{width:8px;height:8px;border-radius:50%;background:var(--money);position:relative;flex-shrink:0}
.ping::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--money);animation:ping 1.8s ease-out infinite}
@keyframes ping{to{transform:scale(3);opacity:0}}
.halo{position:relative;width:120px;height:120px;margin:0 auto}
.halo .r{position:absolute;inset:-10px;border-radius:50%;border:1.5px solid rgba(255,210,31,.35);animation:halo 2.6s ease-out infinite}
.halo .r.b{animation-delay:1.3s}
@keyframes halo{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.35);opacity:0}}
.halo .face{position:absolute;inset:0;box-shadow:0 0 0 4px var(--night),0 0 0 7px var(--sun),0 20px 40px -10px rgba(255,210,31,.5)}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#B8BCCB;margin-top:10px}
.hint svg{animation:bnc 1.2s ease-in-out infinite}
@keyframes bnc{50%{transform:translateY(-4px)}}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{padding:14px 12px;border-radius:20px}
.tile .v{font-weight:800;font-size:19px;letter-spacing:-.03em;margin-top:6px}
.tile .k{font-size:12px;font-weight:600;color:var(--dim)}

.ring{transform:rotate(-90deg)}
.ring .fg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}

/* dock */
.dock{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;height:68px;border-radius:24px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 18px 40px -16px rgba(15,18,34,.3);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 6px}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim);height:56px;justify-content:center;border-radius:16px}
.dock button.on{color:var(--ink)}
.dock button.on .di{background:var(--ink);color:#FFF}
.dock .di{width:40px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.dock .z{width:60px;height:60px;border-radius:20px;background:linear-gradient(180deg,#FFDB3D,var(--sun2));justify-self:center;margin-top:-30px;box-shadow:0 14px 26px -8px rgba(255,195,0,.8),0 0 0 5px var(--bg)}

/* luna bubble */
.bub{position:absolute;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;gap:10px;align-items:flex-end;animation:bubIn .45s cubic-bezier(.2,1.2,.4,1)}
.bub.nodock{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.bub .tx{flex:1;background:var(--ink);color:#FFF;border-radius:20px 20px 20px 6px;padding:12px 14px;font-size:14px;line-height:1.45;box-shadow:var(--sh2)}
.bub .tx b{color:var(--sun)}
.bub .x{display:block;margin-top:6px;font-size:12px;font-weight:700;color:#9DA2B5}
@keyframes bubIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* coach marks */
.coach{position:absolute;inset:0;z-index:60}
.coach .hole{position:absolute;border-radius:22px;box-shadow:0 0 0 2000px rgba(15,18,34,.66);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.coach .hole::after{content:"";position:absolute;inset:-6px;border-radius:26px;border:2px solid var(--sun);animation:halo 1.8s ease-out infinite}
.coach .cc{position:absolute;left:16px;right:16px;background:#FFF;border-radius:24px;padding:16px;box-shadow:var(--sh2);animation:bubIn .35s ease}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line2);transition:width .25s}
.dots i.on{width:20px;background:var(--ink)}

/* trade flow */
.steph{display:flex;align-items:center;gap:10px;padding:14px 0 0}
.stepk{font-size:12.5px;font-weight:800;color:var(--dim)}
.prog{display:flex;gap:4px;margin-top:10px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line2)}
.prog i.on{background:var(--ink)}
.radar{width:240px;height:240px;margin:30px auto 0;position:relative;border-radius:50%}
.radar .rg{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,210,31,.0),rgba(255,210,31,.0) 70%,rgba(255,210,31,.55));animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.radar .blip{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--sun);box-shadow:0 0 12px var(--sun);animation:blip 2.2s ease-out infinite;opacity:0}
@keyframes blip{0%,20%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.6)}}
.opp{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);position:relative;transition:transform .12s}
.opp:active{transform:scale(.98)}
.opp.best{border:2px solid var(--ink)}
.opp .sq{width:56px;height:56px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex-shrink:0;gap:2px}
.sq.buy{background:var(--money-t);color:var(--money-d)} .sq.sell{background:var(--loss-t);color:#C7323C}
.cbar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:8px}
.cbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--sun),var(--money))}
.chip{height:30px;padding:0 10px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800}
.chip.ok{background:var(--money-t);color:var(--money-d)} .chip.soon{background:#FEF3DC;color:#9A5F00} .chip.gone{background:var(--loss-t);color:#C7323C}
.chip .bd{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.pm{width:56px;height:56px;border-radius:18px;background:var(--soft);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa button{height:46px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);font-weight:800;font-size:15px}
.qa button.on{background:var(--ink);border-color:var(--ink);color:var(--sun)}
.tog{width:52px;height:32px;border-radius:16px;background:var(--line2);position:relative;flex-shrink:0;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#FFF;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .2s}
.tog[aria-checked="true"]{background:var(--money)}
.tog[aria-checked="true"]::after{transform:translateX(20px)}
.cdbar{height:74px;border-radius:20px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.cdbar .fl{position:absolute;inset:0 auto 0 0;border-radius:20px;transition:width 1s linear,background .6s}
.cdbar .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:38px;letter-spacing:-.03em;color:#FFF}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.chat p{align-self:flex-start;max-width:90%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:16px 16px 16px 6px;padding:10px 13px;font-size:14px;line-height:1.45;color:#E7E9F0;animation:glide .4s ease both}

/* win splash */
.splash{position:absolute;inset:0;z-index:80;background:radial-gradient(circle at 50% 42%,#1F2A48,var(--night) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:24px}
.rays{position:absolute;width:900px;height:900px;left:50%;top:42%;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,rgba(255,210,31,.16) 0deg 8deg,transparent 8deg 22deg);animation:spin 18s linear infinite;mask:radial-gradient(circle,#000 20%,transparent 62%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 62%)}
.wcard{position:relative;text-align:center;animation:wcard .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes wcard{from{transform:scale(.4) translateY(40px);opacity:0}}
.wamt{font-weight:800;font-size:64px;letter-spacing:-.05em;line-height:1;background:linear-gradient(180deg,#FFF6B8,var(--sun) 50%,#F2A900);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:12px}
.conf i{position:absolute;width:9px;height:14px;border-radius:2px;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.cfall{position:absolute;top:-40px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1A1,var(--sun) 45%,#E8A900);animation:fall linear forwards}

/* sheets, toast */
.sheetbg{position:absolute;inset:0;z-index:70;background:rgba(15,18,34,.45);display:flex;align-items:flex-end;animation:fadeb .2s ease}
@keyframes fadeb{from{opacity:0}}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:#FFF;border-radius:28px 28px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:sheetup .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetup{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 16px}
.toast{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#FFF;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:700;opacity:0;transition:all .3s;z-index:90;white-space:nowrap;pointer-events:none;box-shadow:var(--sh2)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* onboarding */
.ob{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.ob .grow{flex:1;min-height:16px}
.field{height:58px;border-radius:18px;border:1.5px solid var(--line2);background:#FFF;padding:0 18px;font:inherit;font-size:17px;font-weight:700;width:100%;color:var(--ink)}
.field:focus{outline:none;border-color:var(--ink)}
.seg{height:52px;border-radius:17px;background:var(--soft);padding:4px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.seg button{border-radius:13px;font-weight:800;font-size:15px;color:var(--dim)}
.seg button.on{background:#FFF;color:var(--ink);box-shadow:var(--sh)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fgrid button{aspect-ratio:1;max-width:100%;border-radius:24px;border:2px solid transparent;background:#FFF;padding:8px;box-shadow:var(--sh);transition:transform .15s}
.fgrid button.on{border-color:var(--ink);transform:scale(1.04)}
.trust{display:flex;gap:10px;align-items:flex-start;padding:12px 0}
.trust+.trust{border-top:1px solid var(--line)}
.ticon{width:38px;height:38px;border-radius:12px;background:var(--money-t);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.splashlogo{animation:lpop .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes lpop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.zl{stroke-dasharray:260;stroke-dashoffset:260;animation:zdraw 1.4s cubic-bezier(.7,0,.2,1) .35s forwards}
@keyframes zdraw{to{stroke-dashoffset:0}}

.row{display:flex;align-items:center;gap:12px;padding:13px 0}
.row+.row{border-top:1px solid var(--line)}
.lvl{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.lvl i{display:block;height:100%;border-radius:4px;background:var(--sun);transition:width .8s}
input[type=range]{width:100%;accent-color:var(--ink)}
.practice{background:var(--sun-t);border:1px solid #F4E08A;color:var(--sun-ink);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;margin-top:12px}

/* v3 additions */
.drawer{position:absolute;inset:0;z-index:75;display:flex}
.drawer .bg{position:absolute;inset:0;background:rgba(15,18,34,.5);animation:fadeb .2s ease}
.drawer .pane{position:relative;width:86%;max-width:350px;height:100%;background:var(--bg);overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:slideR .32s cubic-bezier(.2,.8,.2,1);box-shadow:20px 0 60px -20px rgba(15,18,34,.4)}
@keyframes slideR{from{transform:translateX(-100%)}}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border-radius:15px;font-weight:700;font-size:15px;text-align:left}
.mi:active{background:var(--soft)}
.mi .mic{width:38px;height:38px;border-radius:12px;background:#FFF;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mi .tag{margin-left:auto;font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:8px}
.mgrp{font-size:12px;font-weight:800;color:var(--mute);margin:16px 10px 4px}
.mode{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:10px;font-size:12.5px;font-weight:800;letter-spacing:.02em}
.mode.starter{background:#EDEDE7;color:#4A4F63}
.mode.plus{background:linear-gradient(135deg,#FFE45C,#FFC300);color:#3A2C00}
.mode.pro{background:linear-gradient(135deg,#1C2338,#0F1424);color:#FFD21F;box-shadow:inset 0 0 0 1px rgba(255,210,31,.45)}
.mode.elite{background:linear-gradient(135deg,#FFD21F,#FF9E85 50%,#A894FF);color:#0F1222}
.mode.ondark.starter{background:rgba(255,255,255,.1);color:#E7E9F0}
.mset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mset button{border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#FFF}
.mset button .s{font-size:11px;font-weight:600;color:#9DA2B5}
.ladder{display:flex;gap:6px;margin-top:12px}
.ladder .rg{flex:1;border-radius:13px;padding:9px 6px;text-align:center;background:var(--soft);border:1.5px solid transparent}
.ladder .rg .a{font-weight:800;font-size:14px}
.ladder .rg .k{font-size:10.5px;font-weight:700;color:var(--dim)}
.ladder.dark .rg{background:rgba(255,255,255,.06)}
.ladder.dark .rg .k{color:#8F95AA}
.ladder .rg.now{border-color:var(--sun);background:rgba(255,210,31,.14);transform:scale(1.03)}
.ladder .rg.lost{opacity:.5;text-decoration:line-through}
.ladder .rg.won{border-color:var(--money);background:rgba(15,179,122,.14)}
.step{width:40px;height:40px;border-radius:12px;background:var(--soft);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:#FFF;border:1.5px solid var(--line);text-align:left;width:100%}
.chk .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chk[aria-checked="true"]{border-color:var(--ink)}
.chk[aria-checked="true"] .bx{background:var(--ink);border-color:var(--ink)}
.codein{height:62px;border-radius:18px;border:1.5px solid var(--line2);background:#FFF;width:100%;text-align:center;font:inherit;font-size:22px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.codein:focus{outline:none;border-color:var(--ink)}
.msgs{display:flex;flex-direction:column;gap:6px}
.m{max-width:82%;padding:10px 13px;font-size:14.5px;line-height:1.45;animation:glide .3s ease both}
.m.in{align-self:flex-start;background:#FFF;border:1px solid var(--line);border-radius:18px 18px 18px 6px}
.m.out{align-self:flex-end;background:var(--ink);color:#FFF;border-radius:18px 18px 6px 18px}
.typing{align-self:flex-start;background:#FFF;border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.qr{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.qr button{height:38px;padding:0 14px;border-radius:13px;border:1.5px solid var(--ink);font-weight:700;font-size:13.5px;background:#FFF}
.livepop{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:85;background:var(--night);color:#FFF;border-radius:22px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh2);animation:dropIn .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes dropIn{from{transform:translateY(-120%)}}
.livetag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;background:#EF4D57;color:#FFF;font-size:11.5px;font-weight:800;letter-spacing:.06em}
.livetag i{width:6px;height:6px;border-radius:50%;background:#FFF;animation:blink 1s infinite}
.stage{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:16/11;max-width:100%;background:radial-gradient(circle at 50% 30%,#2A3558,#0F1424 75%)}
.eqz{display:flex;align-items:flex-end;gap:3px;height:18px}
.eqz i{width:3px;border-radius:2px;background:var(--sun);animation:eqz .9s ease-in-out infinite;height:100%;transform-origin:bottom}
.eqz i:nth-child(2){animation-delay:.15s}.eqz i:nth-child(3){animation-delay:.3s}.eqz i:nth-child(4){animation-delay:.45s}
@keyframes eqz{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.qrbox{width:168px;height:168px;margin:0 auto;border-radius:18px;background:#FFF;border:1px solid var(--line);padding:12px}
.sharecard{border-radius:28px;padding:22px;background:linear-gradient(160deg,var(--night),var(--night2));color:#FFF;position:relative;overflow:hidden}
.sharecard::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 100% 0%,rgba(255,210,31,.35),transparent 60%)}
.sharecard>*{position:relative}
.range{width:100%;accent-color:var(--sun)}
.ctrade{background:#FFF;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--sh);align-self:stretch;animation:glide .35s ease both}
.ctrade .qa button.on{background:var(--ink);color:var(--sun)}


/* v4 alive layer */
.mode.standard{background:linear-gradient(135deg,#FFE45C,#FFC300);color:#3A2C00}
.mode.advanced{background:linear-gradient(135deg,#7FD9B5,#0FB37A);color:#06301F}
.mode.max{background:linear-gradient(120deg,#FFD21F,#FF8A6B,#A894FF,#6EC3FF,#FFD21F);background-size:300% 100%;color:#0F1222;animation:maxflow 4s linear infinite}
@keyframes maxflow{to{background-position:300% 0}}
.mode.none{background:#EDEDE7;color:#7E8397}
.night::before{background:radial-gradient(60% 50% at 85% 0%,rgba(255,210,31,.28),transparent 70%),radial-gradient(50% 45% at 0% 100%,rgba(15,179,122,.2),transparent 70%),radial-gradient(40% 40% at 60% 60%,rgba(127,168,255,.12),transparent 70%);background-size:160% 160%;animation:aurora 9s ease-in-out infinite alternate}
@keyframes aurora{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFD21F;opacity:0;animation:rise 4.5s linear infinite;pointer-events:none}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-220px) scale(1);opacity:0}}
.launch{position:absolute;inset:0;z-index:100;background:radial-gradient(circle at 50% 42%,#222B4A,#0A0E1A 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s ease}
.launch.out{opacity:0;pointer-events:none}
.launch .rays{opacity:.7}
.launch .word{display:flex;gap:1px;margin-top:22px;font-weight:800;font-size:34px;letter-spacing:-.03em;color:#FFF}
.launch .word span{opacity:0;transform:translateY(14px);animation:lw .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes lw{to{opacity:1;transform:none}}
.launch .bar{width:140px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:26px;overflow:hidden}
.launch .bar i{display:block;height:100%;width:0;background:var(--sun);border-radius:2px;animation:lbar 2s ease forwards .3s}
@keyframes lbar{to{width:100%}}
.ringlogo{position:relative;width:120px;height:120px}
.ringlogo::before,.ringlogo::after{content:"";position:absolute;inset:-18px;border-radius:44px;border:2px solid rgba(255,210,31,.4);animation:halo 2s ease-out infinite}
.ringlogo::after{animation-delay:1s}
.slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 8px;margin:0 -16px;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 86%;max-width:340px;height:220px;border-radius:28px;scroll-snap-align:center;position:relative;overflow:hidden;color:#FFF;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;box-shadow:var(--sh2)}
.slide h3{font-size:22px;font-weight:800;line-height:1.1;max-width:62%}
.slide p{font-size:13px;margin-top:6px;max-width:60%;opacity:.85;line-height:1.4}
.slide .art{position:absolute;right:-6px;top:0;bottom:0;width:52%;display:flex;align-items:center;justify-content:center}
.sdots{display:flex;gap:5px;justify-content:center;margin-top:8px}
.sdots i{width:6px;height:6px;border-radius:3px;background:var(--line2);transition:all .3s}
.sdots i.on{width:18px;background:var(--ink)}
.orbit{animation:spin 8s linear infinite;transform-origin:center;transform-box:fill-box}
.ticker{overflow:hidden;margin:12px -16px 0;padding:10px 0;background:var(--night);color:#FFF;position:relative}
.ticker .tr{display:flex;gap:26px;width:max-content;animation:tick 26s linear infinite;padding-left:16px}
@keyframes tick{to{transform:translateX(-50%)}}
.ticker span{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;white-space:nowrap}
.poke{display:inline-block;animation:poke 1s ease-in-out infinite}
@keyframes poke{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-6px)}}
.pokeR{display:inline-block;animation:pokeR 1s ease-in-out infinite}
@keyframes pokeR{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}
.tierc{width:100%;text-align:left;border-radius:22px;padding:14px 16px;background:#FFF;border:2px solid var(--line);display:flex;align-items:center;gap:12px;position:relative;transition:transform .15s,border-color .15s}
.tierc.on{border-color:var(--ink);transform:scale(1.015);box-shadow:var(--sh2)}
.tierc .rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tierc.on .rad{border-color:var(--ink)}
.tierc.on .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.flag{position:absolute;top:-11px;left:16px;height:22px;padding:0 9px;border-radius:7px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:4px}
.box3d{animation:boxwob 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes boxwob{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-3deg)}}
.boxshake{animation:bshake .12s linear infinite}
@keyframes bshake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-3deg)}50%{transform:translate(3px,-1px) rotate(3deg)}75%{transform:translate(-2px,2px) rotate(-2deg)}}
.lid{transition:transform .6s cubic-bezier(.2,1.4,.4,1);transform-origin:50% 100%;transform-box:fill-box}
.lid.open{transform:translateY(-60px) rotate(-25deg)}
.orbwrap{position:relative;width:300px;height:300px;max-width:100%;margin:0 auto}
.orbwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.orbwrap .face{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.cap{min-height:66px;text-align:center;font-size:16px;font-weight:600;line-height:1.45;color:#E7E9F0;padding:0 10px}
.cbtn{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.cbtn.end{background:#EF4D57;border-color:#EF4D57}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--soft);padding:4px;border-radius:16px;height:50px}
.tabs button{border-radius:12px;font-weight:800;font-size:14.5px;color:var(--dim)}
.tabs button.on{background:#FFF;color:var(--ink);box-shadow:var(--sh)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.zl{stroke-dashoffset:0}}

.face.ai{box-shadow:0 0 0 2px rgba(255,210,31,.0),0 8px 22px -8px rgba(15,18,34,.6);position:relative}
.face.ai::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 48%,transparent 60%);background-size:250% 100%;animation:holo 4.5s ease-in-out infinite;pointer-events:none}
@keyframes holo{0%,60%{background-position:120% 0}100%{background-position:-120% 0}}
.face svg .eyes{animation:blink 5s infinite;transform-origin:50% 45%}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.aitag{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 8px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.aitag.max{background:linear-gradient(90deg,#FFE27A,#FFC300,#FFE27A);background-size:200% 100%;animation:shim 3s linear infinite;color:#2A2000}
.aitag.pro{background:var(--night);color:var(--sun)}.aitag.advanced{background:#E8E6FF;color:#3B2FA0}.aitag.crypto{background:#FFEBD2;color:#8A4A00}
@keyframes shim{to{background-position:-200% 0}}
.aicard{padding:14px;display:flex;align-items:center;gap:14px}
.aicard.maxc{background:linear-gradient(160deg,#FFFBEA,#FFF);border-color:#F2D57A}
.mfil{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 2px;scrollbar-width:none}.mfil::-webkit-scrollbar{display:none}
.mfil button{height:38px;padding:0 16px;border-radius:99px;background:#FFF;border:1.5px solid var(--line);font-weight:800;font-size:13.5px;white-space:nowrap;flex-shrink:0}
.mfil button.on{background:var(--ink);color:#FFF;border-color:var(--ink)}
.flagship{position:relative;overflow:hidden;margin-top:14px;border-radius:28px;padding:18px;background:linear-gradient(155deg,#1C1A10,#0F1222 60%,#1A1508);box-shadow:0 24px 50px -24px rgba(255,195,0,.7);border:1px solid rgba(255,210,31,.35)}
.fs-glow{position:absolute;width:260px;height:260px;left:-60px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,31,.45),transparent 65%);animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(170px,90px)}}
.fs-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,210,31,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,210,31,.07) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent 80%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 80%)}
.fs-face{position:relative;border-radius:30px;padding:3px;background:linear-gradient(135deg,#FFF3B0,#FFC300 40%,#7A5A00 70%,#FFD21F);animation:fsg 2.6s ease-in-out infinite}
.fs-face .face{border-radius:27px}
@keyframes fsg{0%,100%{box-shadow:0 0 0 0 rgba(255,210,31,.5),0 0 24px rgba(255,210,31,.35)}50%{box-shadow:0 0 0 8px rgba(255,210,31,0),0 0 40px rgba(255,210,31,.6)}}
.fs-stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fs-stats div{border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);padding:9px 10px;color:#FFF}
.fs-stats b{display:block;font-size:14px;font-weight:800}.fs-stats small{font-size:11px;color:#8F95AA}
.dep{margin-top:18px;background:#FFF;border:1px solid var(--line);border-radius:28px;padding:18px 16px 14px;box-shadow:var(--sh2)}
.dep-amt{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.dep-amt .num{font-size:52px;font-weight:800;letter-spacing:-.05em}
.dep-pm{width:52px;height:52px;border-radius:18px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.dep-pm:active{transform:scale(.92)}
.dep-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.dep-chips button{height:56px;border-radius:16px;border:1.5px solid var(--line);background:#FFF;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.dep-chips button i{font-style:normal;font-size:10px;font-weight:700;color:var(--dim);margin-top:3px}
.dep-chips button.on{background:var(--sun);border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.dep-chips button.on i{color:var(--ink)}
.dep-other{display:block;margin:12px auto 0;font-weight:800;font-size:13.5px;text-decoration:underline}
.dep-get{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dep-get>div{border-radius:20px;background:var(--night);color:#FFF;padding:12px 14px;display:flex;align-items:center;gap:8px}
.dep-get b{font-size:20px;font-weight:800}.dep-get small{font-size:11.5px;color:#8F95AA}
.dep-next{width:100%;margin-top:10px;height:44px;border-radius:14px;background:var(--sun-t);color:#5A4400;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
/* ===== v6 ===== */
.card{background:linear-gradient(180deg,#FFFFFF,#FCFCF9)}
button.card{transition:transform .15s}button.card:active{transform:scale(.98)}
.rv{opacity:0;transform:translateY(22px) scale(.985)}
.rv.in{opacity:1;transform:none;transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}

.flabel{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}

const iqTile=(s=64)=>`<span class="oa-ic" style="width:${s}px;height:${s}px;background:#FFF"><img src="${IQM}" alt="IQ Option" style="width:${Math.round(s*.68)}px;height:${Math.round(s*.68)}px"></span>`;
const zTile=(s=64)=>`<span class="oa-ic" style="width:${s}px;height:${s}px;background:#FFD21F">${ZLOGO(Math.round(s*.6)).replace('#FFD21F','#0F1222')}</span>`;
const linkArt=()=>`<div class="oa-link">${iqTile()}<span class="oa-dots"><i></i><i></i><i></i></span>${zTile()}</div>`;
const _ob11=VIEWS.ob;
VIEWS.ob=()=>{if(S.ob!==1||S.connected)return _ob11().replace(/<span class="oa-ic" style="background:#FFF;color:#0F1222">IQ<\/span>/g,iqTile());
  if(CTX.oa)return _ob11().replace(/<span class="oa-ic" style="background:#FFF;color:#0F1222">IQ<\/span>/g,iqTile());
  if(CTX.oaFail)return `<div class="ob">${obHead3(1,'Create a new account to use Zubabot','Your IQ Option account was made without Zubabot’s link, so it can’t connect. A new free account takes about a minute.')}
    <div class="oa-card"><div class="oa-link">${iqTile()}<span class="oa-x">✕</span>${zTile()}</div>
      <div class="oa-list"><div><i>1</i><span>Tap <b>Create a new IQ Option account</b> below.</span></div><div><i>2</i><span>Sign up with a <b>new email</b>, not the one on your old account.</span></div><div><i>3</i><span>If IQ Option opens your old account, tap <b>Log out</b> first, then <b>Sign up</b>.</span></div></div></div>
    <p class="dim" style="font-size:12.5px;line-height:1.5;margin-top:12px;text-align:center">Your old account stays as it is. You can still withdraw from it on IQ Option.</p>
    <div class="grow"></div>
    <button class="btn sun" style="margin-top:18px" onclick="CTX.oaFail=0;oaStart('new')"><span class="sw"></span>Create a new IQ Option account</button>
    <button class="btn" style="height:48px;font-size:14px;margin-top:6px" onclick="CTX.oaFail=0;CTX.inv=1;go('ob')">I joined Zubabot before · I have an invite code</button></div>`;
  if(CTX.inv)return `<div class="ob">${obHead3(1,'Enter your invite code','For members who joined Zubabot before. Your code is in your welcome message from support.')}
    <label for="inv" class="label" style="display:block;margin-top:22px">Invite code</label>
    <input id="inv" class="codein" style="margin-top:8px" maxlength="11" autocomplete="one-time-code" placeholder="ZB-XXXX-XX" oninput="this.value=this.value.toUpperCase();$('iErr').textContent=''">
    <p id="iErr" role="alert" style="font-size:13px;font-weight:700;color:var(--loss);margin-top:8px;min-height:18px"></p>
    <button style="font-size:13.5px;font-weight:700;text-decoration:underline;text-underline-offset:3px;align-self:flex-start" onclick="openSupport()">Lost your code? Message support</button>
    <p class="oa-demo" style="text-align:left">Demo: try <b>ZB-7Q4K-21</b></p>
    <div class="grow"></div>
    <button class="btn ink" style="margin-top:16px" onclick="checkInvite()">Continue with IQ Option login</button>
    <button class="btn" style="height:46px;font-size:14px;margin-top:4px" onclick="CTX.inv=0;go('ob')">Back</button></div>`;
  return `<div class="ob">${obHead3(1,'Connect IQ Option','Sign up in one tap. We detect your account automatically.')}
    <div class="oa-card">${linkArt()}
      <div class="oa-list">${['No ID to copy, no support chat','Sign up or log in on IQ Option’s own page','Zubabot never sees your password'].map(x=>`<div><i>✓</i>${x}</div>`).join('')}</div></div>
    <div class="grow"></div>
    <button class="btn sun" style="margin-top:18px" onclick="oaStart('new')"><span class="sw"></span>Create my free IQ Option account</button>
    <button class="btn" style="height:48px;font-size:14px;margin-top:6px" onclick="iqHave()">I already have an IQ Option account</button>
    <p class="dim" style="font-size:12px;line-height:1.45;margin-top:8px;text-align:center">Have IQ Option but didn’t join through Zubabot? Create a new account above with a <b style="color:var(--ink)">new email</b>.</p>
    <button class="oa-inv" onclick="CTX.inv=1;go('ob')">Joined Zubabot before? <b>Use invite code</b></button>
    <button class="oa-demo" style="text-decoration:underline;width:100%" onclick="oaStart('foreign')">Demo: log in with an account not made with our link</button>
    <p class="oa-demo" style="margin-top:4px">Zubabot is an independent project built on IQ Option. It is not run by IQ Option.</p></div>`;
};
function checkInvite(){const v=($('inv').value||'').trim().toUpperCase().replace(/[\s-]/g,'');
  if(!v){$('iErr').textContent='Enter your invite code.';return}
  if(!/^ZB[A-Z0-9]{6}$/.test(v)){$('iErr').textContent='That code doesn’t look right. It starts with ZB.';return}
  S.invite=v;save();SND.coin();CTX.inv=0;oaStart('invite')}
oaStart=function(kind){CTX.oa=kind;go('ob');let k=0;
  const labels=['Opening IQ Option',kind==='new'?'You sign up (about 1 minute)':'You log in','You tap Allow',kind==='invite'?'Matching your invite code':'Checking it’s a Zubabot account'];
  const box0=$('oaSt');if(box0)box0.innerHTML=labels.map(x=>`<div><b></b>${x}</div>`).join('');

/* ===================== Languages: the whole app in the person's language =====================
   How it works
   - The language comes from the link (?l=es from the bot's buttons and the mini app link), then from the server
     (the funnel the person came from). English needs nothing.
   - i18n/<lang>.js (loaded in <head>, before the first paint) holds the translations and the local AI traders.
   - Every text on screen is translated as it appears: numbers, money and names are taken out first

      const r = await fetch(API() + '/api/i18n/miss', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({lang, keys, wait: 1})});
      const d = await r.json(); let n = 0; for (const [k, v] of Object.entries(d.dict || {})) { D.set(k, v); n++; }
      if (n) { keepCache(); walk(document.body); }
      if (d.pending) setTimeout(() => keys.filter((k) => !D.has(k)).forEach((k) => MISS.add(k)), 8000);
    } catch (e) { keys.forEach((k) => MISS.add(k)); }
  }
  setInterval(sendMisses, 3500);
  // edits made in Admin since this file was built
  if (API()) fetch(API() + '/api/i18n/dict?lang=' + lang + '&since=' + (Z.since || 0)).then((r) => r.json()).then((d) => {
    let n = 0; for (const [k, v] of Object.entries(d.dict || {})) { D.set(k, v); n++; }
    if (d.roster && Object.keys(d.roster).length) applyRoster(d.roster);
    if (d.v) Z.since = d.v; if (n) { keepCache(); for (const el of document.querySelectorAll('*')) if (el.childNodes.length) for (const c of el.childNodes) if (c.nodeType === 3) done.delete(c); walk(document.body); }
  }).catch(() => {});

  /* ---------- things that aren't on screen ---------- */
  // toasts and Telegram popups are on screen (covered). Spoken lines go to the server, which says them in the language.
  // training videos: the version in this language when it exists
  Z.video = (id) => (I.videos && I.videos.includes(id) ? 'academy/' + lang + '/' + id + '.mp4' : 'academy/v2/' + id + '.mp4');
  // dates and numbers in the local format
  Z.locale = {pt: 'pt-BR', es: 'es-419', tl: 'fil-PH', fr: 'fr-FR', th: 'th-TH'}[lang] || 'en-GB';
})();

</script>
